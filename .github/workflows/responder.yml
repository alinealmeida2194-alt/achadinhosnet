name: Receber ofertas e responder

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch: {}

concurrency:
  group: bot-afiliados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Receber ofertas do Telegram e responder Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MENSAGENS_ID: ${{ secrets.IG_MENSAGENS_ID }}
        run: python bot.py --responder
      - name: Salvar respondidos
        run: |
          git config user.name "bot-afiliados"
          git config user.email "bot-afiliados@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "Comentários respondidos" && git pull --rebase && git push)
