name: Postar ofertas

on:
  schedule:
    # de hora em hora, das 9h às 22h (horário de Brasília = UTC-3)
    - cron: "47 11-23 * * *"
    - cron: "47 0 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

concurrency:
  group: bot-afiliados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Postar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MENSAGENS_ID: ${{ secrets.IG_MENSAGENS_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python bot.py
      - name: Salvar histórico e vitrine
        run: |
          git config user.name "bot-afiliados"
          git config user.email "bot-afiliados@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "Ofertas postadas" && git pull --rebase && git push)
